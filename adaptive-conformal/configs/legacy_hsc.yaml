# Experiment 4 config: Legacy → HSC
# -------------------------------------------------------
survey_pair: legacy_hsc

# -------------------------------------------------------
# Embedding paths
# -------------------------------------------------------
source_embeddings_train: /projects/bfir/ssourav/embeddings/legacy_hsc/legacy_train.npy
target_embeddings_train: /projects/bfir/ssourav/embeddings/legacy_hsc/hsc_train.npy

source_embeddings_cal: /projects/bfir/ssourav/embeddings/legacy_hsc/legacy_cal.npy
target_embeddings_cal: /projects/bfir/ssourav/embeddings/legacy_hsc/hsc_cal.npy

source_embeddings_test: /projects/bfir/ssourav/embeddings/legacy_hsc/legacy_test.npy
target_embeddings_test: /projects/bfir/ssourav/embeddings/legacy_hsc/hsc_test.npy

# -------------------------------------------------------
# Split fractions
# 70% train / 15% cal / 15% test
# Inside train: 80% translator / 20% difficulty
# -------------------------------------------------------
difficulty_train_fraction: 0.20

# -------------------------------------------------------
# Translator
# -------------------------------------------------------
ridge_alpha: 1.0

# -------------------------------------------------------
# PCA
# -------------------------------------------------------
pca_dim: 64

# -------------------------------------------------------
# Backbones
# -------------------------------------------------------
backbones:
  - astropt_850m
